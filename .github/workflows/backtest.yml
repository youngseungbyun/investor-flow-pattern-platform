name: 패턴 과거 성과 측정 (주간)

# 보관 중인 일봉으로 패턴·단계별 5·10·20거래일 뒤 승률을 다시 잰다.
# 결과는 pattern_stats 에 쌓이고, 패턴 판정이 점수 옆에 과거 승률을 붙인다.
on:
  schedule:
    # 일요일 06:00 KST
    - cron: '0 21 * * 6'
  workflow_dispatch:

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: 스키마 확인
        run: npm run db:migrate
      - name: 백테스트
        run: npm run backtest
