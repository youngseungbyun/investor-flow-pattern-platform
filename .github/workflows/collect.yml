name: 장 마감 후 데이터 수집

# 한국 증시 마감(15:30 KST) 이후에 돈다.
# cron 은 UTC 기준이라 07:40 UTC = 16:40 KST 다.
# 평일만 돌리고, 휴장일은 수집 단계가 스스로 0건으로 끝낸다.
on:
  schedule:
    - cron: '40 7 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '기준일 (YYYY-MM-DD). 비우면 오늘'
        required: false
      lookback:
        description: '수급 소급 일수'
        required: false
        default: '5'

concurrency:
  # 이전 수집이 아직 돌고 있으면 겹치지 않게 한다. 같은 행을 두 번 쓰면
  # upsert 라 결과는 같지만 무료 DB 커넥션을 낭비한다.
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      # 수집이 원격 DB 에 바로 쓴다. 로컬 PGlite 를 거치지 않는다.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      KIS_DOMAIN: ${{ secrets.KIS_DOMAIN }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
      INVESTOR_FLOW_PROVIDER: kis
      MINUTE_PROVIDER: kis,yahoo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: 기준일 결정
        id: d
        run: |
          # 입력이 있으면 그걸 쓰고, 없으면 KST 기준 오늘.
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: 스키마 확인
        run: npm run db:migrate

      - name: 일봉
        run: npm run batch -- ohlcv --date ${{ steps.d.outputs.date }} --days 5

      - name: 투자자 수급
        run: npm run batch -- flow --date ${{ steps.d.outputs.date }} --lookback ${{ github.event.inputs.lookback || 5 }}

      - name: 공시 (유통주식수·임원 매매)
        run: npm run batch -- dart --date ${{ steps.d.outputs.date }}
        continue-on-error: true

      - name: 패턴 판정
        run: npm run batch -- patterns --date ${{ steps.d.outputs.date }}

      - name: 수급 이벤트 정규화
        run: npm run batch -- flow-events --date ${{ steps.d.outputs.date }}

      - name: 지지선·시그널
        run: npm run batch -- lines --date ${{ steps.d.outputs.date }}

      - name: 오래된 데이터 정리
        # 무료 DB 용량이 한정돼 있다. 수집과 같은 주기로 잘라 총량을 고정한다.
        run: npm run db:retention -- --keep 60

      - name: 결과 요약
        if: always()
        run: npm run batch -- verify --date ${{ steps.d.outputs.date }}
        continue-on-error: true
