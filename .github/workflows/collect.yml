name: 장 마감 후 데이터 수집

# 한국 증시 마감(15:30 KST) 이후에 돈다. cron 은 UTC 기준이다.
# 2026-09-06 사용자 지시로 예약을 껐다가, 2026-10-07 대표 지시로 다시 켠다.
# 평일만 돌리고, 휴장일은 수집 단계가 스스로 0건으로 끝낸다.
on:
  schedule:
    # 장 마감 직후(16:35 KST) 회차는 맥미니 예약 `sd-after-close` 가 workflow_dispatch 로 건다.
    # GitHub 예약은 한두 시간, 심하면 7시간까지 밀려 "마감 직후"를 못 지켰다(10-07 16:40 예약이 23:44 시작).
    # 같은 시각 cron 을 같이 두면 같은 수집이 두 번 돌아 DB 연결만 낭비하므로 뺐다.
    # 맥미니가 꺼져 있던 날은 아래 오전 회차가 5일치를 소급해 메운다.
    # 09:10 KST - DATA.go.kr 일봉은 T+1 이라 다음 영업일 오전에 올라온다.
    - cron: '10 0 * * 2-6'
  workflow_dispatch:
    inputs:
      date:
        description: '기준일 (YYYY-MM-DD). 비우면 오늘'
        required: false
      lookback:
        description: '수급 소급 일수'
        required: false
        default: '5'

concurrency:
  # 이전 수집이 아직 돌고 있으면 겹치지 않게 한다. 같은 행을 두 번 쓰면
  # upsert 라 결과는 같지만 무료 DB 커넥션을 낭비한다.
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 2026-09-26: 50분이면 공시 스텝이 잡 전체를 잡아먹어 패턴·정리가 매번 skipped 였다
    # (run 36212856437). 공시에 스텝 단위 상한(20분)을 따로 두고, 그 뒤 스텝
    # (패턴 약 3분·지지선 약 6분·정리)이 들어갈 여유까지 잡아 75분으로 늘린다.
    timeout-minutes: 75

    env:
      # 수집이 원격 DB 에 바로 쓴다. 로컬 PGlite 를 거치지 않는다.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      KIS_DOMAIN: ${{ secrets.KIS_DOMAIN }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
      INVESTOR_FLOW_PROVIDER: kis
      MINUTE_PROVIDER: kis,yahoo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # npm ci 는 lock 과 package.json 이 완전히 일치할 때만 돈다.
      # 이 저장소는 의존성을 넣었다 뺀 이력이 있어 러너에서 불일치가 났다.
      # 수집 잡은 재현성보다 안정적으로 도는 게 중요하므로 install 을 쓴다.
      - run: npm install --no-audit --no-fund

      - name: 기준일 결정
        id: d
        run: |
          # 입력이 있으면 그걸 쓰고, 없으면 KST 기준 오늘.
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: 스키마 확인
        run: npm run db:migrate

      - name: 일봉 (금융위)
        run: npm run batch -- ohlcv --date ${{ steps.d.outputs.date }} --days 5

      # 금융위는 T+1 이라 장이 끝나도 당일·전일이 비어 있는 시간대가 길다.
      # KIS 는 마감 직후 바로 주므로 그 공백만 메운다. 끝나지 않은 세션은
      # 스텝 안에서 걸러지므로 장중에 돌아도 안전하다.
      - name: 일봉 공백 보강 (KIS)
        timeout-minutes: 15
        run: npm run batch -- ohlcv-kis --date ${{ steps.d.outputs.date }} --days 5
        continue-on-error: true

      - name: 투자자 수급
        run: npm run batch -- flow --date ${{ steps.d.outputs.date }} --lookback ${{ github.event.inputs.lookback || 5 }}

      # 수급을 받은 직후에 바로 정규화한다. 예전에는 공시·패턴 뒤에 있었는데,
      # 그 사이 단계가 어긋나면 조건 검색이 보는 유일한 테이블에 구멍이 남았다.
      # 실제로 08-10·08-11 이틀이 비어 어떤 수급 조건도 0건이 나왔다.
      # 조회 창을 넉넉히 잡아 이전 회차가 흘린 날짜까지 같이 메운다.
      - name: 수급 이벤트 정규화
        run: npm run batch -- flow-events --date ${{ steps.d.outputs.date }} --lookback 10

      # 공시는 부가 정보라 실패하거나 느려도 분석을 막으면 안 된다.
      # 원격 DB 에 행마다 왕복하는 구조라 오래 걸리는 날이 있어 스텝 상한을 따로 둔다.
      # 시간 초과·실패 모두 continue-on-error 로 넘기고, 아래 스텝은 !cancelled() 로 계속 돈다.
      - name: 공시 (유통주식수·임원 매매)
        run: npm run batch -- dart --date ${{ steps.d.outputs.date }}
        timeout-minutes: 20
        continue-on-error: true

      # 분석은 수집과 기준일이 다르다.
      # 금융위 일봉은 T+1 이고 KIS 갭보강도 장이 끝나야 받는다. 그래서 "오늘"로
      # 패턴을 돌리면 봉 없는 날을 판정해 매번 0건으로 끝나고, 뒤늦게 도착한
      # 어제 일봉은 다음 회차의 기준일이 또 그다음 날이라 영영 판정되지 않았다.
      # 실제로 08-11·08-12 이틀 연속 패턴·라인이 0건이었다.
      #
      # 여기부터는 앞 스텝(특히 공시)이 실패·시간 초과여도 돈다. 잡이 취소된 경우만 멈춘다.
      # 패턴·지지선은 분석 기준일이 비면 --date 가 빈 값이 되므로 기준일이 있을 때만 돈다.
      - name: 분석 기준일 결정
        id: a
        if: ${{ !cancelled() }}
        run: echo "date=$(npx tsx scripts/last-bar-day.ts)" >> "$GITHUB_OUTPUT"

      - name: 패턴 판정
        if: ${{ !cancelled() && steps.a.outputs.date != '' }}
        run: npm run batch -- patterns --date ${{ steps.a.outputs.date }}

      - name: 지지선·시그널
        if: ${{ !cancelled() && steps.a.outputs.date != '' }}
        run: npm run batch -- lines --date ${{ steps.a.outputs.date }}

      - name: 오래된 데이터 정리
        if: ${{ !cancelled() }}
        # 무료 DB 용량이 한정돼 있다. 수집과 같은 주기로 잘라 총량을 고정한다.
        # --keep 을 명시하면 retention.ts 의 DEFAULT_KEEP(25) 을 무시하고 이 값이 이긴다.
        # 60 으로 박아 뒀던 게 2026-09-05 용량 초과의 직접 원인이라 인자를 없애 기본값을 따르게 한다.
        run: npm run db:retention

      - name: 결과 요약
        if: always()
        run: npm run batch -- verify --date ${{ steps.a.outputs.date || steps.d.outputs.date }}
        continue-on-error: true
