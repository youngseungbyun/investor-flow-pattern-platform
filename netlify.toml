# Netlify 배포 설정
#
# Next.js App Router 는 서버 라우트와 동적 페이지가 있어 정적 내보내기로는 못 올린다.
# @netlify/plugin-nextjs 가 이걸 Netlify Functions 로 변환한다.
#
# 환경변수는 이 파일에 넣지 않는다. Netlify 대시보드나 CLI 로 설정한다.
#   netlify env:set DATABASE_URL "..."
# 이 파일은 공개 저장소에 커밋되므로 값이 들어가면 그대로 노출된다.

[build]
  # 스키마는 배포 때 만든다. Netlify DB 의 접속 문자열은 빌드 환경에만
  # NETLIFY_DATABASE_URL 로 주입되고 외부 도구는 기본이 읽기 전용이라,
  # 마이그레이션을 로컬에서 돌릴 수 없다. 빌드 안에서 도는 게 유일한 경로다.
  # 마이그레이션은 이미 적용된 것을 건너뛰므로 매 배포마다 돌아도 안전하다.
  # 마이그레이션 실패로 배포 전체가 막히지 않게 한다. 접속 문자열이 아직 없으면
  # 스키마 없이라도 사이트는 뜨고, 화면은 에러 패널로 상황을 알려준다.
  command = "node -e \"console.log('[db] NETLIFY_DATABASE_URL:', process.env.NETLIFY_DATABASE_URL ? 'present' : 'MISSING')\" && (npm run db:migrate || echo '[db] migration skipped') && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # Git 연동 빌드에서만 Netlify DB 의 접속 문자열이 주입된다.
  NETLIFY_DB_BUILD = "git"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 배치 스크립트는 서버리스에서 돌릴 수 없다.
# 종목당 API 호출이 많아 함수 실행 시간 제한을 넘긴다.
# 수집은 로컬이나 별도 워커에서 돌리고, 배포본은 적재된 결과만 읽는다.
[functions]
  node_bundler = "esbuild"
