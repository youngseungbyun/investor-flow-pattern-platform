# Netlify 배포 설정
#
# Next.js App Router 는 서버 라우트와 동적 페이지가 있어 정적 내보내기로는 못 올린다.
# @netlify/plugin-nextjs 가 이걸 Netlify Functions 로 변환한다.
#
# 환경변수는 이 파일에 넣지 않는다. Netlify 대시보드나 CLI 로 설정한다.
#   netlify env:set DATABASE_URL "..."
# 이 파일은 공개 저장소에 커밋되므로 값이 들어가면 그대로 노출된다.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # 빌드 중에는 DB 에 붙지 않는다. 붙으려 하면 커넥션 타임아웃으로 빌드가 길어진다.
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 배치 스크립트는 서버리스에서 돌릴 수 없다.
# 종목당 API 호출이 많아 함수 실행 시간 제한을 넘긴다.
# 수집은 로컬이나 별도 워커에서 돌리고, 배포본은 적재된 결과만 읽는다.
[functions]
  node_bundler = "esbuild"
